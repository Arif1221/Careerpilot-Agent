services:
  - type: web
    name: careerpilot-ai-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CAREERPILOT_MODEL
        value: claude-haiku-4-5-20251001
      - key: ALLOWED_ORIGINS
        value: "*"
