services:
  - type: web
    name: careerpilot-ai-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        sync: false
      - key: CAREERPILOT_MODEL
        value: gemini-3.1-flash-lite
      - key: ALLOWED_ORIGINS
        value: "*"
